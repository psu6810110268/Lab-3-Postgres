{% extends 'base.html' %}
{% block body %}
<ul class="nav justify-content-center" style="padding-top: 1em;">
  <li class="nav-item">
    <a class="btn btn-primary" href="{{ url_for('notes_create') }}">Create</a>
  </li>
</ul>
{% for note in notes %}
<div class="card my-3">
  <div class="card-body">
    <h4 class="card-title">{{ note.title }}</h4>
    <div class="card-text my-3">
      {{ note.description }}
    </div>
    <div class="card-footer text-muted">
      Tags: 
      {% for t in note.tags %}
        <!-- ลิงก์ไปดู Tag เดิม -->
        <a href="{{ url_for('tags_view', tag_name=t.name) }}">{{ t.name }}</a>
        <!-- ปุ่มแก้ไข Tag (เพิ่มเข้ามาใหม่) -->
        <a class="text-warning text-decoration-none fw-bold" style="font-size: 0.85em; margin-right: 8px;" href="{{ url_for('tags_edit', tag_name=t.name) }}">[Edit]</a>
      {% endfor %}
      <br>
      Last update: {{ note.updated_date }}
      <br>
      <a class="btn btn-sm btn-secondary mt-2" href="{{ url_for('notes_edit', note_id=note.id) }}">Edit Note</a>
    </div>
  </div>
</div>
{% endfor %}
{% endblock %}
